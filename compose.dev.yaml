services:
  db:
    ports:
      - "127.0.0.1:${DB_PUBLISH_PORT:-5432}:5432"

  backend:
    build:
      target: development
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8080},http://127.0.0.1:${APP_PORT:-8080},http://localhost:5173,http://127.0.0.1:5173
      SESSION_COOKIE_SECURE: "false"
      ENABLE_DEV_SEED_USER: "true"
      BOOTSTRAP_ADMIN_USERNAME: admin
      BOOTSTRAP_ADMIN_PASSWORD: password
